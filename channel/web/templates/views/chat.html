                    <!-- Scroll-to-bottom FAB -->
                    <button id="scroll-to-bottom-btn"

                                   hover:shadow-xl hover:scale-105"
                            onclick="_autoScrollEnabled = true; scrollChatToBottom(true);">
                        <i class="fas fa-chevron-down text-sm"></i>
                    </button>

                    <!-- Chat Input -->
                    <div class="flex-shrink-0 border-t border-slate-200 dark:border-white/10 bg-white dark:bg-[#1A1A1A] px-4 py-3">
                        <div class="max-w-3xl mx-auto">
                            <!-- Composer card: text on top, session controls along the bottom -->
                            <div id="composer-card" class="composer-card">
                                <!-- Attachment preview: scrolls horizontally above the text -->
                                <div id="attachment-preview" class="attachment-preview hidden"></div>

                                <div class="composer-identity-row">
                                    <textarea id="chat-input"
                                              class="composer-textarea"
                                              rows="1"
                                              data-i18n-placeholder="input_placeholder"
                                              placeholder="输入消息，/ 使用指令，@ 引用文件"></textarea>
                                </div>

                                <div class="composer-toolbar">
                                    <div class="composer-group">
                                        <button id="new-chat-btn" type="button" class="composer-icon-btn"
                                                onclick="newChat()">
                                            <i class="fas fa-plus"></i>
                                        </button>
                                        <button id="clear-context-btn" type="button" class="composer-icon-btn ctx-pie-btn">
                                            <span id="ctx-pie-mini" class="ctx-pie-mini"><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="4" opacity="0.35"></circle></svg></span>
                                        </button>
                                        <button id="attach-btn" type="button" class="composer-icon-btn"
                                                onclick="toggleAttachMenu(event)">
                                            <i class="fas fa-paperclip"></i>
                                        </button>

                                        <span class="composer-divider"></span>

                                        <button id="workspace-selector-btn" type="button" class="composer-chip"
                                                onclick="toggleWorkspaceSelector(event)"
                                                data-tip-float data-tooltip-pos="top">
                                            <i class="fas fa-folder-open"></i>
                                            <span id="workspace-selector-label" class="composer-chip-label" data-i18n="ws_default_workspace">默认空间</span>
                                            <i class="fas fa-chevron-down composer-chip-caret"></i>
                                        </button>

                                        <button id="permission-selector-btn" type="button" class="composer-chip composer-chip-icon-only"
                                                onclick="togglePermissionSelector(event)"
                                                data-tip-float data-tooltip-pos="top">
                                            <i id="permission-selector-icon" class="fas fa-shield-halved"></i>
                                            <span id="permission-selector-label" class="composer-chip-label" data-i18n="perm_full_access">全部可访问</span>
                                            <i class="fas fa-chevron-down composer-chip-caret"></i>
                                        </button>
                                    </div>

                                    <div class="composer-group composer-group-end">
                                        <button id="model-selector-btn" type="button" class="composer-chip"
                                                onclick="toggleModelSelector(event)"
                                                data-tip-float data-tooltip-pos="top">
                                            <i class="fas fa-microchip"></i>
                                            <span id="model-selector-label" class="composer-chip-label">—</span>
                                            <i class="fas fa-chevron-down composer-chip-caret"></i>
                                        </button>

                                        <!-- The Agent identity chip sits right of the model, avatar-only,
                                             as the face the reply comes from (matches the desktop composer).
                                             Only shown in multi-Agent mode. -->
                                        <div id="composer-identity" class="composer-identity hidden">
                                            <button id="composer-agent-btn" type="button" class="composer-agent-btn"
                                                    onclick="toggleComposerAgentMenu(event)"
                                                    data-tip-float data-tooltip-pos="top">
                                                <span id="composer-agent-avatar" class="agent-avatar agent-avatar-32"></span>
                                            </button>
                                            <div id="composer-agent-menu" class="composer-menu composer-menu-up hidden"></div>
                                        </div>
                                        <button id="optimize-btn" type="button" class="composer-icon-btn"
                                                data-tooltip="智能优化输入">
                                            <i class="fas fa-magic text-[13px]"></i>
                                        </button>
                                        <button id="mic-btn" type="button" class="composer-icon-btn text-slate-400"
                                                data-tooltip="点击录音 / 再按一次结束">
                                            <i class="fas fa-microphone text-sm"></i>
                                        </button>
                                        <button id="steer-btn" type="button"
                                                class="hidden composer-send-btn composer-steer-btn"
                                                data-i18n-aria-label="steer_active"
                                                aria-label="引导当前任务"
                                                data-tooltip="引导当前任务">
                                            <i class="fas fa-arrow-turn-up text-sm"></i>
                                        </button>
                                        <button id="send-btn" class="composer-send-btn" disabled>
                                            <i class="fas fa-paper-plane text-sm"></i>
                                        </button>
                                    </div>
                                </div>

                                <input type="file" id="file-input" class="hidden" multiple
                                       accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.json,.xml,.zip,.rar,.7z,.py,.js,.ts,.java,.c,.cpp,.go,.rs,.md">
                                <input type="file" id="folder-input" class="hidden" multiple webkitdirectory directory>
                                <div id="attach-menu" class="attach-menu hidden">
                                    <button id="attach-file-option" type="button" class="attach-menu-item" onclick="triggerFileUpload()">
                                        <i class="fas fa-file-arrow-up"></i>
                                        <span data-i18n="attach_menu_file">上传文件</span>
                                    </button>
                                    <button id="attach-folder-option" type="button" class="attach-menu-item" onclick="triggerFolderUpload()">
                                        <i class="fas fa-folder-plus"></i>
                                        <span data-i18n="attach_menu_folder">上传文件夹</span>
                                    </button>
                                </div>
                                <div id="slash-menu" class="slash-menu hidden"></div>
                                <div id="mention-menu" class="mention-menu hidden"></div>
                                <div id="workspace-selector-menu" class="workspace-selector-menu hidden"></div>
                                <div id="permission-selector-menu" class="composer-menu hidden"></div>
                                <div id="model-selector-menu" class="composer-menu composer-menu-wide hidden"></div>
                            </div>
                        </div>
                    </div>
                  </div><!-- /#chat-main -->

                    <!-- ================================================== -->
                    <!-- Workspace panel: file preview + file manager        -->
                    <!-- ================================================== -->
                    <aside id="workspace-panel" class="workspace-panel hidden">
                        <div id="ws-resizer" class="workspace-resizer" title="Drag to resize"></div>

                                    </button>
                                </div>
                                <div class="workspace-header-actions">
                                    <button id="ws-btn-save" class="workspace-icon-btn hidden" onclick="savePreviewEdit()"

                                        <i class="fas fa-floppy-disk"></i>
                                    </button>
                                    <button id="ws-btn-edit-cancel" class="workspace-icon-btn hidden" onclick="cancelPreviewEdit()"
                                            data-i18n-title="ws_edit_cancel" title="退出编辑">
                                        <i class="fas fa-rotate-left"></i>
                                    </button>
                                    <button id="ws-btn-edit" class="workspace-icon-btn hidden" onclick="startPreviewEdit()"
                                            data-i18n-title="ws_edit" title="编辑">
                                        <i class="fas fa-pen-to-square"></i>
                                    </button>
                                    <button id="ws-btn-external" class="workspace-icon-btn hidden" onclick="openPreviewExternally()"
                                            data-i18n-title="ws_open_external" title="在新标签页打开">
                                        <i class="fas fa-up-right-from-square"></i>
                                    </button>
                                    <button id="ws-btn-download" class="workspace-icon-btn hidden" onclick="downloadPreviewFile()"
                                            data-i18n-title="ws_download" title="下载">
                                        <i class="fas fa-download"></i>
                                    </button>
                                    <button id="ws-btn-copy" class="workspace-icon-btn hidden" onclick="copyPreviewPath()"
                                            data-i18n-title="ws_copy_path" title="复制路径">
                                        <i class="fas fa-link"></i>
                                    </button>
                                    <button class="workspace-icon-btn" onclick="closeWorkspacePanel(true)"
                                            data-i18n-title="ws_close" title="关闭">
                                        <i class="fas fa-xmark"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Preview tab -->
                            <div id="ws-body-preview" class="workspace-body active">
                                <div id="ws-preview-title" class="workspace-file-title hidden"></div>
                                <div id="ws-preview-content" class="workspace-preview-content"></div>
                            </div>

                            <!-- Files tab -->
                            <div id="ws-body-files" class="workspace-body">
                                <div class="workspace-files-toolbar">
                                    <div class="workspace-search">
                                        <i class="fas fa-magnifying-glass"></i>
                                        <input id="ws-search-input" type="text" spellcheck="false"
                                               data-i18n-placeholder="ws_search_placeholder" placeholder="搜索文件">
                                    </div>
                                    <button class="workspace-icon-btn" onclick="refreshWorkspaceTree()"
                                            data-i18n-title="ws_refresh" title="刷新">
                                        <i class="fas fa-rotate-right"></i>
                                    </button>
                                </div>
                                <div id="ws-breadcrumb" class="workspace-breadcrumb"></div>
                                <div id="ws-file-list" class="workspace-file-list"></div>
                            </div>
                        </div>
                    </aside>
                </div>
