                <!-- ====================================================== -->
                <!-- VIEW: Skills                                            -->
                <!-- ====================================================== -->
                <div id="view-skills" class="view">
                    <div class="flex-1 overflow-y-auto p-6">
                        <div class="max-w-4xl mx-auto">

                            <!-- Panel: list -->
                            <div id="skills-panel-list">
                                <div class="flex items-center justify-between mb-6">
                                    <div>
                                        <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100" data-i18n="skills_title">技能管理</h2>
                                        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1" data-i18n="skills_desc">查看、启用或禁用 Agent 技能</p>
                                    </div>
                                    <a href="https://skills.cowagent.ai/" target="_blank"
                                       class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-primary-500 bg-primary-50 dark:bg-primary-900/20 hover:bg-primary-100 dark:hover:bg-primary-900/30 transition-colors">
                                        <i class="fas fa-puzzle-piece text-[10px]"></i>
                                        <span data-i18n="skills_hub_btn">探索技能广场</span>
                                    </a>
                                </div>

                                <!-- Built-in Tools Section -->
                                <div class="mb-8">
                                    <div class="flex items-center gap-2 mb-3">
                                        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500" data-i18n="tools_section_title">内置工具</span>
                                        <span id="tools-count-badge" class="hidden px-2 py-0.5 rounded-full text-xs bg-slate-100 dark:bg-white/10 text-slate-500 dark:text-slate-400"></span>
                                    </div>
                                    <div id="tools-empty" class="flex items-center gap-2 py-4 text-slate-400 dark:text-slate-500 text-sm">
                                        <i class="fas fa-spinner fa-spin text-xs"></i>
                                        <span data-i18n="tools_loading">加载工具中...</span>
                                    </div>
                                    <div id="tools-list" class="grid gap-3 sm:grid-cols-2 hidden"></div>
                                </div>

                                <!-- MCP Servers Section -->
                                <div class="mb-8" id="mcp-section">
                                    <div class="flex items-center gap-2 mb-3">
                                        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500" data-i18n="mcp_section_title">MCP</span>
                                        <span id="mcp-count-badge" class="hidden px-2 py-0.5 rounded-full text-xs bg-slate-100 dark:bg-white/10 text-slate-500 dark:text-slate-400"></span>
                                        <button type="button" id="mcp-add-btn"
                                                class="ml-auto inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-primary-500 bg-primary-50 dark:bg-primary-900/20 hover:bg-primary-100 dark:hover:bg-primary-900/30 transition-colors cursor-pointer">
                                            <i class="fas fa-plus text-[10px]"></i>
                                            <span data-i18n="mcp_add">Add server</span>
                                        </button>
                                    </div>
                                    <p class="text-xs text-slate-400 dark:text-slate-500 mb-3" data-i18n="mcp_section_hint">Add, edit, or disable MCP servers. Saved servers apply on the next message.</p>
                                    <div id="mcp-empty" class="flex items-center gap-2 py-4 text-slate-400 dark:text-slate-500 text-sm">
                                        <span data-i18n="mcp_empty">No MCP servers configured</span>
                                    </div>
                                    <div id="mcp-list" class="grid gap-3 sm:grid-cols-2 hidden"></div>
                                </div>

                                <!-- Skills Section -->
                                <div>
                                    <div class="flex items-center gap-2 mb-3">
                                        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500" data-i18n="skills_section_title">技能</span>
                                        <span id="skills-count-badge" class="hidden px-2 py-0.5 rounded-full text-xs bg-slate-100 dark:bg-white/10 text-slate-500 dark:text-slate-400"></span>
                                    </div>
                                    <div class="flex items-center gap-2 mb-3">
                                        <input id="skill-install-input" type="text"
                                               class="flex-1 min-w-0 px-3 py-1.5 rounded-lg text-sm bg-white dark:bg-[#1A1A1A] border border-slate-200 dark:border-white/10 text-slate-700 dark:text-slate-200 placeholder:text-slate-400 focus:outline-none focus:border-primary-400"
                                               data-i18n-placeholder="skill_install_placeholder"
                                               placeholder="Skill Hub name or GitHub URL">
                                        <button type="button" id="skill-install-btn"
                                                class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-white bg-primary-500 hover:bg-primary-600 transition-colors cursor-pointer">
                                            <i class="fas fa-download text-[10px]"></i>
                                            <span data-i18n="skill_install_btn">Install</span>
                                        </button>
                                    </div>
                                    <div id="skills-empty" class="flex flex-col items-center justify-center py-12">
                                        <div class="w-14 h-14 rounded-2xl bg-amber-50 dark:bg-amber-900/20 flex items-center justify-center mb-3">
                                            <i class="fas fa-bolt text-amber-400 text-lg"></i>
                                        </div>
                                        <p class="text-slate-500 dark:text-slate-400 font-medium" data-i18n="skills_loading">加载技能中...</p>
                                        <p class="text-sm text-slate-400 dark:text-slate-500 mt-1" data-i18n="skills_loading_desc">技能加载后将显示在此处</p>
                                    </div>
                                    <div id="skills-list" class="grid gap-4 sm:grid-cols-2"></div>
                                </div>
                            </div>

                            <!-- Panel: skill viewer / editor (replaces list) -->
                            <div id="skills-panel-viewer" class="hidden">
                                <div class="flex items-center gap-3 mb-6">
                                    <button onclick="closeSkillViewer()"
                                            class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm
                                                   text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/10
                                                   border border-slate-200 dark:border-white/10 transition-colors cursor-pointer">
                                        <i class="fas fa-arrow-left text-xs"></i>
                                        <span data-i18n="skill_back">返回列表</span>
                                    </button>
                                    <h2 id="skill-viewer-title"
                                        class="flex-1 min-w-0 text-base font-semibold text-slate-800 dark:text-slate-100 font-mono truncate"></h2>
                                    <span id="skill-viewer-readonly"
                                          class="hidden truncate max-w-[40%] px-2 py-0.5 rounded-full text-xs bg-slate-100 dark:bg-white/10 text-slate-500 dark:text-slate-400"
                                          data-i18n="skill_builtin_readonly">内置技能不可编辑（重启会覆盖）</span>
                                    <button id="skill-btn-edit" onclick="skillEditor.start()"
                                            class="doc-action-btn hidden">
                                        <i class="fas fa-pen text-xs"></i>
                                        <span data-i18n="ws_edit">编辑</span>
                                    </button>
                                    <button id="skill-btn-save" onclick="skillEditor.save()"
                                            class="doc-action-btn doc-action-btn-primary hidden">
                                        <i class="fas fa-check text-xs"></i>
                                        <span data-i18n="ws_edit_save">保存 (Ctrl+S)</span>
                                    </button>
                                    <button id="skill-btn-cancel" onclick="skillEditor.cancel()"
                                            class="doc-action-btn hidden">
                                        <i class="fas fa-xmark text-xs"></i>
                                        <span data-i18n="ws_edit_cancel">退出编辑</span>
                                    </button>
                                </div>
                                <div class="bg-white dark:bg-[#1A1A1A] rounded-xl border border-slate-200 dark:border-white/10 overflow-hidden">
                                    <div id="skill-viewer-content"
                                         class="p-5 overflow-y-auto text-sm text-slate-700 dark:text-slate-200"
                                         style="max-height: calc(100dvh - 220px)"></div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
