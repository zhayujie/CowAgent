    <!-- Execution-record detail: opened from a history card, shows the full
         delivered body (recovered from the receiver's session) plus meta. -->
    <div id="run-detail-modal-overlay" class="fixed inset-0 bg-black/50 z-[100] hidden flex items-center justify-center">
        <div class="bg-white dark:bg-[#1A1A1A] rounded-2xl border border-slate-200 dark:border-white/10 shadow-xl
                    w-full max-w-2xl mx-4 max-h-[90vh] overflow-y-auto">
            <div class="p-6">
                <div class="flex items-center gap-3 mb-5">
                    <div class="w-10 h-10 rounded-xl bg-primary-50 dark:bg-primary-900/20 flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-clock-rotate-left text-primary-500"></i>
                    </div>
                    <div class="min-w-0 flex-1">
                        <h3 id="run-detail-title" class="font-semibold text-slate-800 dark:text-slate-100 text-base truncate" data-i18n="record_detail_title">Execution detail</h3>
                    </div>
                    <button id="run-detail-close" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 cursor-pointer text-xl leading-none px-1 flex-shrink-0">&times;</button>
                </div>
                <div id="run-detail-meta" class="grid grid-cols-2 gap-x-4 gap-y-3 text-sm mb-4"></div>
                <div id="run-detail-error-wrap" class="mb-4 hidden">
                    <div class="text-xs text-slate-400 dark:text-slate-500 mb-1" data-i18n="record_detail_error">Error</div>
                    <div id="run-detail-error" class="rounded-lg border border-red-200 dark:border-red-900/40 bg-red-50 dark:bg-red-900/20 px-3 py-2 text-sm text-red-500 break-words whitespace-pre-wrap"></div>
                </div>
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <div class="text-xs text-slate-400 dark:text-slate-500" data-i18n="record_detail_output">Delivered</div>
                        <div id="run-detail-view-toggle" class="inline-flex rounded-md border border-slate-200 dark:border-white/10 overflow-hidden text-xs">
                            <button id="run-detail-view-preview" data-view="preview" class="px-2 py-0.5 text-slate-500 dark:text-slate-400" data-i18n="record_detail_view_preview">Preview</button>
                            <button id="run-detail-view-text" data-view="text" class="px-2 py-0.5 text-slate-500 dark:text-slate-400 border-l border-slate-200 dark:border-white/10" data-i18n="record_detail_view_text">Text</button>
                        </div>
                    </div>
                    <div id="run-detail-output" class="rounded-lg border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-white/5 px-3 py-2 text-sm text-slate-800 dark:text-slate-100 break-words max-h-80 overflow-y-auto"></div>
                </div>
            </div>
        </div>
    </div>
