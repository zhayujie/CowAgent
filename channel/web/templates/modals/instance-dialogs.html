    <!-- Connect to another device: pair this browser with CowAgent elsewhere -->
    <div id="instance-add-overlay" class="fixed inset-0 bg-black/50 z-[200] hidden flex items-center justify-center"
         onclick="if (event.target === this) closeInstanceAdd()">
        <div class="bg-panel rounded-2xl border border-slate-200 dark:border-white/10 shadow-xl w-full max-w-md mx-4 overflow-hidden">
            <form id="instance-add-form-wrap" onsubmit="submitInstanceAdd(event)" autocomplete="off">
                <div class="p-6">
                    <div class="flex items-center gap-3 mb-5">
                        <div class="w-10 h-10 rounded-xl bg-primary-50 dark:bg-primary-900/20 flex items-center justify-center flex-shrink-0">
                            <i class="fas fa-link text-primary-500"></i>
                        </div>
                        <div class="min-w-0">
                            <h3 class="font-semibold text-slate-800 dark:text-slate-100 text-base" data-i18n="devices_add_title">连接其他设备</h3>
                            <p class="text-xs text-slate-400 dark:text-slate-500 mt-0.5" data-i18n="devices_add_desc">连接另一台电脑或服务器上的 CowAgent</p>
                        </div>
                    </div>

                    <div id="instance-add-form" class="space-y-4">
                        <div id="instance-add-insecure" class="hidden flex items-start gap-2 text-xs text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-amber-900/20 rounded-lg px-3 py-2.5">
                            <i class="fas fa-shield-halved mt-0.5"></i>
                            <span data-i18n="devices_problem_insecure">当前页面不是通过 localhost 或 HTTPS 打开的，浏览器不允许在这里切换设备。</span>
                        </div>
                        <div>
                            <label for="instance-add-url" class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1.5" data-i18n="devices_addr">地址</label>
                            <input id="instance-add-url" type="text" spellcheck="false" oninput="onInstanceAddInput(event)"
                                   data-i18n-placeholder="devices_addr_placeholder" placeholder="http://192.168.1.10:9899"
                                   class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600
                                          bg-slate-50 dark:bg-[#1A1A1A] text-sm font-mono text-slate-800 dark:text-slate-100
                                          focus:outline-none focus:border-primary-500 transition-colors">
                        </div>
                        <div id="instance-add-code-row">
                            <label for="instance-add-code" class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1.5" data-i18n="devices_code">配对码</label>
                            <input id="instance-add-code" type="text" spellcheck="false" maxlength="512" oninput="onInstanceAddInput(event)"
                                   placeholder="XXXX-XXXX"
                                   class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600
                                          bg-slate-50 dark:bg-[#1A1A1A] text-base font-mono tracking-[0.2em] uppercase text-slate-800 dark:text-slate-100
                                          focus:outline-none focus:border-primary-500 transition-colors">
                        </div>
                        <div id="instance-add-linked" class="hidden flex items-center gap-2 text-xs text-primary-600 dark:text-primary-400 bg-primary-50 dark:bg-primary-900/20 rounded-lg px-3 py-2.5">
                            <i class="fas fa-link"></i><span data-i18n="devices_link_detected">已识别配对链接，直接连接即可</span>
                        </div>
                        <p class="text-xs leading-relaxed text-slate-400 dark:text-slate-500" data-i18n="devices_add_hint">
                            在对方的「设置 › 设备管理」里点「让其他设备连接我」，就能拿到配对码。服务器上运行 cow pair 也可以，或者直接粘贴配对链接。
                        </p>
                        <p id="instance-add-error" class="hidden text-xs text-red-500"></p>
                    </div>

                    <div id="instance-add-done" class="hidden text-center py-4">
                        <div class="w-12 h-12 mx-auto rounded-full bg-emerald-50 dark:bg-emerald-900/30 flex items-center justify-center mb-3">
                            <i class="fas fa-check text-emerald-500 text-lg"></i>
                        </div>
                        <div class="text-sm text-slate-500 dark:text-slate-400" data-i18n="devices_added">已连接</div>
                        <div id="instance-add-done-name" class="mt-1 font-semibold text-slate-800 dark:text-slate-100"></div>
                        <div id="instance-add-done-url" class="mt-0.5 text-xs font-mono text-slate-400 dark:text-slate-500"></div>
                        <p class="mt-4 text-xs leading-relaxed text-slate-400 dark:text-slate-500" data-i18n="devices_added_hint">
                            对方可以随时在「连接我的设备」里移除你。
                        </p>
                    </div>
                </div>

                <div id="instance-add-actions" class="flex items-center justify-end gap-3 px-6 py-4 border-t border-slate-100 dark:border-white/5">
                    <button type="button" onclick="closeInstanceAdd()"
                            class="px-4 py-2 rounded-lg border border-slate-200 dark:border-white/10 text-slate-600 dark:text-slate-300 text-sm font-medium
                                   hover:bg-slate-50 dark:hover:bg-white/5 cursor-pointer transition-colors duration-150" data-i18n="channels_cancel">取消</button>
                    <button type="submit" id="instance-add-submit"
                            class="px-4 py-2 rounded-lg bg-primary-500 hover:bg-primary-600 text-white text-sm font-medium
                                   cursor-pointer transition-colors duration-150 disabled:opacity-50 disabled:cursor-not-allowed">连接</button>
                </div>
                <div id="instance-add-done-actions" class="hidden flex items-center justify-end gap-3 px-6 py-4 border-t border-slate-100 dark:border-white/5">
                    <button type="button" onclick="closeInstanceAdd()"
                            class="px-4 py-2 rounded-lg border border-slate-200 dark:border-white/10 text-slate-600 dark:text-slate-300 text-sm font-medium
                                   hover:bg-slate-50 dark:hover:bg-white/5 cursor-pointer transition-colors duration-150" data-i18n="devices_later">稍后</button>
                    <button type="button" onclick="instanceAddSwitch()"
                            class="px-4 py-2 rounded-lg bg-primary-500 hover:bg-primary-600 text-white text-sm font-medium
                                   cursor-pointer transition-colors duration-150">
                        <i class="fas fa-arrow-right-arrow-left mr-1.5"></i><span data-i18n="devices_switch_now">切换过去</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- The device the console is switched to can't be used right now -->
    <div id="instance-overlay" class="fixed inset-0 z-[190] hidden flex items-center justify-center bg-slate-50/95 dark:bg-[#111]/95 backdrop-blur-sm">
        <div class="bg-panel rounded-2xl border border-slate-200 dark:border-white/10 shadow-xl w-full max-w-sm mx-4 p-7 text-center">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-amber-50 dark:bg-amber-900/20 flex items-center justify-center mb-4">
                <i id="instance-overlay-icon" class="fas fa-plug-circle-exclamation text-xl text-amber-500"></i>
            </div>
            <h3 id="instance-overlay-title" class="font-semibold text-slate-800 dark:text-slate-100 text-base"></h3>
            <p id="instance-overlay-url" class="mt-1 text-xs font-mono text-slate-400 dark:text-slate-500 break-all"></p>
            <p id="instance-overlay-message" class="mt-3 text-sm leading-relaxed text-slate-500 dark:text-slate-400"></p>
            <div class="mt-6 flex flex-col gap-2">
                <button id="instance-overlay-retry" onclick="instanceOverlayRetry()"
                        class="w-full px-4 py-2 rounded-lg bg-primary-500 hover:bg-primary-600 text-white text-sm font-medium cursor-pointer transition-colors duration-150">
                    <i class="fas fa-rotate-right mr-1.5"></i><span data-i18n="devices_retry">重试</span>
                </button>
                <button id="instance-overlay-repair" onclick="instanceOverlayRepair()"
                        class="hidden w-full px-4 py-2 rounded-lg bg-primary-500 hover:bg-primary-600 text-white text-sm font-medium cursor-pointer transition-colors duration-150">
                    <i class="fas fa-link mr-1.5"></i><span data-i18n="devices_repair">重新配对</span>
                </button>
                <button onclick="instanceOverlayBack()"
                        class="w-full px-4 py-2 rounded-lg border border-slate-200 dark:border-white/10 text-slate-600 dark:text-slate-300 text-sm font-medium
                               hover:bg-slate-50 dark:hover:bg-white/5 cursor-pointer transition-colors duration-150">
                    <i class="fas fa-laptop mr-1.5"></i><span data-i18n="devices_back_local">切回本设备</span>
                </button>
            </div>
        </div>
    </div>
