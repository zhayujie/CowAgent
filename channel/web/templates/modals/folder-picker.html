    <!-- Folder Picker Modal (open project) -->
    <div id="folder-picker-overlay" class="fixed inset-0 bg-black/50 z-[200] hidden flex items-center justify-center">
        <div class="bg-white dark:bg-[#1A1A1A] rounded-2xl border border-slate-200 dark:border-white/10 shadow-xl
                    w-full max-w-lg mx-4 overflow-hidden flex flex-col" style="max-height:78vh;">
            <div class="px-6 pt-6 pb-3">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-10 h-10 rounded-xl bg-primary-50 dark:bg-primary-900/20 flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-folder-open text-primary-500"></i>
                    </div>
                    <div class="min-w-0 flex-1">
                        <h3 class="font-semibold text-slate-800 dark:text-slate-100 text-base" data-i18n="ws_sel_open">Open project…</h3>
                        <p id="folder-picker-path" class="text-xs text-slate-500 dark:text-slate-400 mt-0.5 font-mono truncate"></p>
                    </div>
                </div>
                <div id="folder-picker-toolbar" class="flex items-center gap-2 mb-2"></div>
            </div>
            <div id="folder-picker-list" class="flex-1 overflow-y-auto px-3 pb-2 min-h-[220px]"></div>
            <div class="flex items-center justify-between gap-3 px-6 py-4 border-t border-slate-100 dark:border-white/5">
                <span class="text-xs text-slate-400 dark:text-slate-500" id="folder-picker-hint"></span>
                <div class="flex items-center gap-3">
                    <button id="folder-picker-cancel"
                            class="px-4 py-2 rounded-lg border border-slate-200 dark:border-white/10
                                   text-slate-600 dark:text-slate-300 text-sm font-medium
                                   hover:bg-slate-50 dark:hover:bg-white/5 cursor-pointer transition-colors duration-150"></button>
                    <button id="folder-picker-open"
                            class="px-4 py-2 rounded-lg bg-primary-500 hover:bg-primary-600 text-white text-sm font-medium
                                   cursor-pointer transition-colors duration-150"></button>
                </div>
            </div>
        </div>
    </div>
