    <!-- Vendor Credentials Modal -->
    <div id="vendor-modal-overlay" class="fixed inset-0 bg-black/50 z-[100] hidden flex items-center justify-center">
        <div class="bg-white dark:bg-[#1A1A1A] rounded-2xl border border-slate-200 dark:border-white/10 shadow-xl
                    w-full max-w-xl mx-4 max-h-[85vh] flex flex-col">
            <div class="p-6 overflow-y-auto modal-scroll-body">
                <div class="flex items-center gap-3 mb-5">
                    <div class="w-10 h-10 rounded-xl bg-primary-50 dark:bg-primary-900/20 flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-key text-primary-500"></i>
                    </div>
                    <div class="min-w-0 flex-1">
                        <h3 id="vendor-modal-title" class="font-semibold text-slate-800 dark:text-slate-100 text-base"></h3>
                        <p id="vendor-modal-subtitle" class="text-xs text-slate-500 dark:text-slate-400 mt-0.5 font-mono"></p>
                    </div>
                </div>

                <!-- Provider selector (only visible when adding via top button) -->
                <div id="vendor-modal-picker-wrap" class="mb-4 hidden">
                    <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1.5" data-i18n="models_provider">Provider</label>
                    <div id="vendor-modal-picker" class="cfg-dropdown" tabindex="0">
                        <div class="cfg-dropdown-selected">
                            <span class="cfg-dropdown-text">--</span>
                            <i class="fas fa-chevron-down cfg-dropdown-arrow"></i>
                        </div>
                        <div class="cfg-dropdown-menu"></div>
                    </div>
                </div>

                <div class="space-y-4">
                    <div>
                        <div class="flex items-center justify-between gap-2 mb-1.5">
                            <label class="block text-sm font-medium text-slate-600 dark:text-slate-400">API Key</label>
                            <a id="vendor-modal-manage-key" href="https://link-ai.tech/console/models?apikey=1"
                               target="_blank" rel="noopener noreferrer"
                               class="hidden inline-flex items-center gap-1 text-xs text-primary-500 hover:underline">
                                <span data-i18n="models_manage_api_key">Manage API keys</span>
                                <i class="fas fa-arrow-up-right-from-square text-[10px]"></i>
                            </a>
                        </div>
                        <input id="vendor-modal-key" type="text" autocomplete="off" data-1p-ignore data-lpignore="true"
                               class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600
                                      bg-slate-50 dark:bg-white/5 text-sm text-slate-800 dark:text-slate-100
                                      focus:outline-none focus:border-primary-500 font-mono transition-colors"
                               placeholder="sk-...">
                    </div>
                    <div id="vendor-modal-base-wrap">
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1.5">API Base</label>
                        <input id="vendor-modal-base" type="text"
                               class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600
                                      bg-slate-50 dark:bg-white/5 text-sm text-slate-800 dark:text-slate-100
                                      focus:outline-none focus:border-primary-500 font-mono transition-colors"
                               placeholder="https://...../v1">
                        <p id="vendor-modal-base-hint" class="mt-1.5 text-xs text-slate-400 dark:text-slate-500 hidden">
                            <i class="fas fa-info-circle mr-1"></i><span data-i18n="models_base_default_hint">Leave blank to use the official default base URL</span>
                        </p>
                    </div>
                </div>

                <!-- Model catalog (advanced, optional): override preset metadata
                     or add models the preset list does not carry. Collapsed by
                     default so the credential fields stay the focus. -->
                <div id="vendor-modal-catalog-wrap" class="mt-5 pt-4 border-t border-slate-100 dark:border-white/5">
                    <button type="button" id="vendor-modal-catalog-toggle"
                            class="flex items-center gap-2 w-full text-left cursor-pointer group">
                        <i id="vendor-modal-catalog-caret"
                           class="fas fa-chevron-right text-[10px] text-slate-400 dark:text-slate-500 transition-transform duration-150"></i>
                        <span class="text-sm font-medium text-slate-600 dark:text-slate-400 group-hover:text-primary-500 transition-colors"
                              data-i18n="models_catalog">Model catalog</span>
                        <span class="text-xs text-slate-400 dark:text-slate-500"
                              data-i18n="models_catalog_advanced">(Advanced · optional)</span>
                    </button>
                    <div id="vendor-modal-catalog-body" class="hidden mt-3">
                        <div id="vendor-modal-catalog-rows" class="space-y-2 max-h-80 overflow-y-auto pr-0.5"></div>
                        <div class="mt-2 flex items-center gap-2">
                            <button type="button" id="vendor-modal-catalog-add"
                                    class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium
                                           bg-primary-50 dark:bg-primary-900/30 text-primary-600 dark:text-primary-400
                                           hover:bg-primary-100 dark:hover:bg-primary-900/50 cursor-pointer transition-colors">
                                <i class="fas fa-plus text-[10px]"></i><span data-i18n="models_catalog_add">Add model</span>
                            </button>
                            <button type="button" id="vendor-modal-catalog-seed"
                                    class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium
                                           text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/10
                                           cursor-pointer transition-colors">
                                <i class="fas fa-rotate-left text-[10px]"></i><span data-i18n="models_catalog_reset">Restore defaults</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="flex items-center justify-between gap-3 px-6 py-4 border-t border-slate-100 dark:border-white/5 rounded-b-2xl">
                <button id="vendor-modal-clear"
                        class="px-3 py-2 rounded-lg text-xs
                               text-red-500 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20
                               cursor-pointer transition-colors duration-150 hidden"
                        data-i18n="models_clear_credential">Clear credentials</button>
                <span id="vendor-modal-status"
                      class="flex-1 text-xs text-primary-500 opacity-0 transition-opacity duration-300 text-center"></span>
                <button id="vendor-modal-cancel"
                        class="px-4 py-2 rounded-lg border border-slate-200 dark:border-white/10
                               text-slate-600 dark:text-slate-300 text-sm font-medium
                               hover:bg-slate-50 dark:hover:bg-white/5
                               cursor-pointer transition-colors duration-150"
                        data-i18n="cancel">Cancel</button>
                <button id="vendor-modal-save"
                        class="px-4 py-2 rounded-lg bg-primary-500 hover:bg-primary-600 text-white text-sm font-medium
                               cursor-pointer transition-colors duration-150 disabled:opacity-50 disabled:cursor-not-allowed"
                        data-i18n="save">Save</button>
            </div>
        </div>
    </div>
