            <!-- Top Header -->
            <header class="h-14 flex items-center gap-3 px-4 border-b border-slate-200 dark:border-white/10 bg-white dark:bg-[#1A1A1A] flex-shrink-0 z-10">
                <!-- Mobile menu toggle -->
                <button id="menu-toggle" class="lg:hidden p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-white/10 cursor-pointer transition-colors duration-150"
                        onclick="toggleSidebar()">
                    <i class="fas fa-bars text-slate-600 dark:text-slate-300"></i>
                </button>

                <!-- Session panel toggle -->
                <button id="session-toggle-btn" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-white/10 cursor-pointer transition-colors duration-150"
                        onclick="toggleSessionPanel()">
                    <i class="fas fa-clock-rotate-left text-slate-500 dark:text-slate-400"></i>
                </button>

                <!-- Workspace panel toggle (chat view only) -->
                <button id="workspace-toggle-btn" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-white/10 cursor-pointer transition-colors duration-150"
                        onclick="toggleWorkspacePanel()" data-tooltip="工作空间" data-tooltip-pos="bottom">
                    <i class="fas fa-folder-tree text-slate-500 dark:text-slate-400"></i>
                </button>

                <!-- Message navigator toggle (chat view only; shown once there are questions to jump between) -->
                <button id="timeline-toggle-btn" class="timeline-empty p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-white/10 cursor-pointer transition-colors duration-150"
                        data-tooltip="消息导航" data-tooltip-pos="bottom">
                    <i class="fas fa-list-ul text-slate-500 dark:text-slate-400"></i>
                </button>

                <!-- Breadcrumb (hidden on mobile, and in the chat view where it only repeats "Chat") -->
                <div id="header-breadcrumb" class="hidden lg:flex items-center gap-2 text-sm min-w-0" style="display: none">
                    <span id="breadcrumb-group" class="text-slate-400 dark:text-slate-500 truncate" data-i18n="nav_chat">对话</span>
                    <i class="fas fa-chevron-right text-[10px] text-slate-300 dark:text-slate-600"></i>
                    <span id="breadcrumb-page" class="font-medium text-slate-700 dark:text-slate-200 truncate" data-i18n="menu_chat">对话</span>
                </div>

                <div class="flex-1"></div>

                <!-- Language Selector (dropdown) -->
                <div id="lang-selector" class="relative">
                    <button id="lang-toggle" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium
                                                     text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/10
                                                     cursor-pointer transition-colors duration-150"
                            onclick="toggleLangMenu(event)">
                        <i class="fas fa-globe text-xs"></i>
                        <span id="lang-label">EN</span>
                        <i class="fas fa-chevron-down text-[10px] opacity-60"></i>
                    </button>
                    <div id="lang-menu" class="hidden absolute right-0 mt-1 min-w-[120px] py-1 rounded-lg z-50
                                               bg-white dark:bg-slate-800 shadow-lg ring-1 ring-black/5 dark:ring-white/10">
                        <button class="lang-menu-item w-full text-left px-3 py-1.5 text-sm text-slate-600 dark:text-slate-300
                                       hover:bg-slate-100 dark:hover:bg-white/10 cursor-pointer" data-lang="zh"
                                onclick="selectLanguage('zh')">简体中文</button>
                        <button class="lang-menu-item w-full text-left px-3 py-1.5 text-sm text-slate-600 dark:text-slate-300
                                       hover:bg-slate-100 dark:hover:bg-white/10 cursor-pointer" data-lang="zh-Hant"
                                onclick="selectLanguage('zh-Hant')">繁體中文</button>
                        <button class="lang-menu-item w-full text-left px-3 py-1.5 text-sm text-slate-600 dark:text-slate-300
                                       hover:bg-slate-100 dark:hover:bg-white/10 cursor-pointer" data-lang="en"
                                onclick="selectLanguage('en')">English</button>
                    </div>
                </div>

                <!-- Theme Toggle -->
                <button id="theme-toggle" class="p-2 rounded-lg text-slate-500 dark:text-slate-400
                                                  hover:bg-slate-100 dark:hover:bg-white/10
                                                  cursor-pointer transition-colors duration-150"
                        onclick="toggleTheme()">
                    <i id="theme-icon" class="fas fa-moon"></i>
                </button>

                <!-- Docs Link -->
                <a id="docs-link" href="https://docs.cowagent.ai" target="_blank" rel="noopener noreferrer"
                   class="p-2 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/10
                          cursor-pointer transition-colors duration-150" title="Documentation">
                    <i class="fas fa-book text-base"></i>
                </a>

                <!-- Website Link -->
                <a href="https://cowagent.ai" target="_blank" rel="noopener noreferrer"
                   class="p-2 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/10
                          cursor-pointer transition-colors duration-150" title="Website">
                    <i class="fas fa-home text-base"></i>
                </a>

                <!-- GitHub Link -->
                <a href="https://github.com/zhayujie/chatgpt-on-wechat" target="_blank" rel="noopener noreferrer"
                   class="p-2 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/10
                          cursor-pointer transition-colors duration-150" title="GitHub">
                    <i class="fab fa-github text-lg"></i>
                </a>

                <!-- Logout Button (hidden by default) -->
                <button id="logout-btn-header" class="p-2 rounded-lg text-slate-500 dark:text-slate-400
                                                       hover:bg-red-50 hover:text-red-500 dark:hover:bg-red-500/10 dark:hover:text-red-400
                                                       cursor-pointer transition-colors duration-150 hidden"
                        onclick="handleLogout()" title="Logout" data-i18n-title="logout">
                    <i class="fas fa-sign-out-alt text-base"></i>
                </button>
            </header>
