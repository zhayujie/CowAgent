                        <i class="fas fa-chevron-right text-[10px] chevron"></i>
                        <span data-i18n="nav_manage">管理</span>

                    <div class="menu-group-items pl-2">

                            <span data-i18n="menu_agents">智能体</span>
                        </a>
                        <a class="sidebar-item flex items-center gap-3 px-3 py-2 rounded-lg cursor-pointer transition-all duration-150 hover:bg-white/5 hover:text-neutral-200 text-[14px]"

                            <i class="fas fa-sliders item-icon text-xs w-5 text-center"></i>

                        <button type="button" id="sidebar-version" onclick="toggleUpdateMenu(event)"

                <div id="update-menu" class="update-menu hidden" role="menu" aria-labelledby="sidebar-version">

                    <button type="button" id="update-action-item" class="update-menu-item" role="menuitem" onclick="onUpdateActionClick()">
                        <span class="update-menu-icon">
                            <i id="update-action-icon" class="fas fa-arrows-rotate"></i>
                            <span id="update-dot" class="update-dot hidden" aria-hidden="true"></span>

                        <i class="fas fa-arrow-up-right-from-square update-menu-ext"></i>
                    </button>
                    <button type="button" class="update-menu-item" role="menuitem" onclick="openMenuEditorFromFooter()">

                        <span class="update-menu-label" data-i18n="menu_edit">自定义菜单</span>
                    </button>
                </div>
            </div>
        </aside>
        <!-- Close the groups the user folded last time before the first paint,
             so they don't flash open and then animate shut. -->
        <script>
        (function () {
            try {
                var groups = JSON.parse(localStorage.getItem('cow_sidebar_groups') || '{}');
                document.querySelectorAll('#sidebar .menu-group[data-group]').forEach(function (g) {
                    if (groups[g.getAttribute('data-group')] === false) g.classList.remove('open');
                });
            } catch (e) { /* unreadable state: keep the defaults */ }
        })();
        </script>

        <!-- Mobile Overlay -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden cursor-pointer" onclick="toggleSidebar()"></div>
