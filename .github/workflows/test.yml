name: Tests

# Runs the full backend test suite on every push to master and on every PR.
# Previously only a single file (test_bash_streaming.py) was exercised in CI;
# the ~130-file suite never ran here, so regressions could slip past the
# release pipeline. This workflow is the safety net for that gap.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r requirements.txt

      - name: Run backend test suite
        run: python -m pytest tests/ -q

  lint:
    name: ruff (F-class gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Run ruff (fatal on real-bug F-class violations only)
        # F = pyflakes (unused imports, undefined names, dead code) — these are
        # real defects and must stay green. E/W/B (style/bugbear) carry thousands
        # of legacy violations in this codebase, so they are reported but not
        # fatal. F403/F405 (star-imports) are an intentional re-export pattern.
        run: ruff check . --select F --ignore F403,F405